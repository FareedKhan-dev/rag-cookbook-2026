      - Chunking & Indexing: theory/chunking-and-indexing.md
      - Query Transformation: theory/query-transformation.md
      - Reranking & Fusion: theory/reranking-and-fusion.md
      - Adaptive & Agentic: theory/adaptive-and-agentic.md
      - Graph & Memory: theory/graph-and-memory.md
